spring.application.name=nmk-backend

# Developer default: local profile creates/updates JPA entity tables.
# Production deployments MUST explicitly activate the prod profile.
spring.profiles.default=local

# Local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nmk_pos_manual_test?sslMode=DISABLED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database schema safety
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Local backend server
server.port=${PORT:8080}
server.max-http-request-header-size=16KB

# Prescription uploads / Cloudinary
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:ydkweahp}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Request payload limit
app.http.max-request-body-bytes=1048576

# JWT
jwt.secret=${JWT_SECRET}

# Admin bootstrap (optional)
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Local CORS
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.org.springframework.security=INFO
logging.level.nmk_backend.security=INFO

# Razorpay test credentials
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# SMS disabled
sms.enabled=false
sms.auth-key=TEST_AUTH_KEY
sms.sender-id=NMKOPT
sms.flow-id=TEST_FLOW_ID

# Business timezone
app.business.time-zone=Asia/Kolkata

# API rate limits
app.rate-limit.enabled=false
app.rate-limit.window-seconds=60
app.rate-limit.login-per-minute=5
app.rate-limit.appointment-per-minute=5
app.rate-limit.checkout-per-minute=10
app.rate-limit.payment-verify-per-minute=15
app.rate-limit.tracking-per-minute=30
