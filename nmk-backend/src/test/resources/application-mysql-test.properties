# Dedicated integration-test profile. Never use outside an isolated test database.
spring.datasource.url=${MYSQL_TEST_URL:jdbc:mysql://127.0.0.1:3306/nmk_pos_ci?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_TEST_USERNAME:root}
spring.datasource.password=${MYSQL_TEST_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The CI MySQL database is disposable; build the schema from JPA mappings for each test run.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Non-production credentials required to construct the application context during integration tests.
jwt.secret=NMK_MYSQL_TEST_ONLY_SECRET_KEY_2026_DO_NOT_USE_IN_PRODUCTION_123456789
razorpay.key.id=rzp_test_dummy
razorpay.key.secret=MYSQL_TEST_ONLY_DUMMY_SECRET
razorpay.webhook.secret=MYSQL_TEST_ONLY_DUMMY_WEBHOOK_SECRET
cloudinary.cloud-name=test
cloudinary.api-key=
cloudinary.api-secret=
